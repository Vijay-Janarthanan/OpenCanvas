name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the details below to help us fix it.

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "What is the problem?"
      placeholder: "e.g., Canvas video doesn't start playing on Android emulator"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Exact steps to reproduce the bug"
      placeholder: |
        1. Open the app
        2. Play a song (e.g., "Blinding Lights" by The Weeknd)
        3. Wait for canvas to load
        4. [Issue occurs]
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What should happen?"
      placeholder: "Canvas video should start playing after ~1 second"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happens?"
      placeholder: "Canvas never appears, only static album art is shown"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: "Platform"
      options:
        - "Android"
        - "Desktop (Windows)"
        - "Desktop (macOS)"
        - "Desktop (Linux)"
        - "Web"
        - "Flutter"
        - "Other"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "OpenCanvas Version"
      placeholder: "e.g., 1.0.0"
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: "Environment Details"
      description: "OS version, device model, library versions, etc."
      placeholder: |
        - OS: Android 13, Pixel 6 Pro
        - JVM: OpenJDK 17.0.2
        - Kotlin: 1.9.0
        - yt-dlp version: 2024.03.04
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "Logs & Error Messages"
      description: "Paste any relevant error messages or logs"
      placeholder: "E.g., exception stack trace from Logcat or console"
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: "Workaround (if any)"
      description: "Any temporary workaround you've found"
      placeholder: "e.g., Restarting the app fixes the issue"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I've searched for similar bug reports"
          required: true
        - label: "I've checked the FAQ section in documentation"
          required: false
        - label: "yt-dlp is installed and up-to-date"
          required: false
        - label: "I can reproduce the bug consistently"
          required: false
